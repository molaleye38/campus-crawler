[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naija-admissions"
version = "0.1.0"
description = "MCP server exposing a tool to scrape admission data for Nigerian tertiary institutions (universities, polytechnics, colleges of education) via Crawl4AI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "MostepAfrica" }]
keywords = ["mcp", "nigeria", "admissions", "crawl4ai", "education"]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "crawl4ai>=0.9.1",
    "supabase>=2.0.0",
    "postgrest>=1.0.0",
    "boto3>=1.34.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
naija-admissions = "naija_admissions.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/naija_admissions"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
