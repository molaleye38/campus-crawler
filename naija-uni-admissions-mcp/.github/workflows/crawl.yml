name: Crawl Institutions

on:
  workflow_dispatch:
    inputs:
      max_institutions:
        description: "Max institutions to crawl"
        required: false
        default: "50"
      institution_types:
        description: "Filter (comma-separated: university,polytechnic,college_of_education)"
        required: false
        default: "university,polytechnic,college_of_education"
      state:
        description: "Optional state filter (e.g. Lagos)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: microsoft/playwright-actions/setup@v1

      - name: Install dependencies
        run: pip install -e .

      - name: Run crawler
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: |
          ck-crawl \
            --max "${{ inputs.max_institutions }}" \
            --types "${{ inputs.institution_types }}" \
            --state "${{ inputs.state }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-logs-${{ github.run_id }}
          path: |
            data/*.log
            data/state.json
          retention-days: 7
